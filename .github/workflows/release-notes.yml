name: Update GitHub Release Notes

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - .github/workflows/release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-notes
  cancel-in-progress: false

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update descriptions of existing releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            for (const section of changelog.split(/^## /m).slice(1)) {
              const firstNewline = section.indexOf('\n');
              const tag = section.slice(0, firstNewline).trim();
              const body = section.slice(firstNewline + 1).trim();
              if (!/^\d+\.\d+\.\d+$/.test(tag) || !body) {
                throw new Error(`Invalid release notes section: ${tag}`);
              }
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag
              });
              if ((release.body || '').trim() === body) {
                console.log(`Release ${tag} already has the expected notes.`);
                continue;
              }
              await github.rest.repos.updateRelease({
                ...context.repo,
                release_id: release.id,
                body
              });
              console.log(`Updated release notes for ${tag}.`);
            }