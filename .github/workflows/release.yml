# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Release on Maven Central

# Controls when the workflow will run
on:
  push:
    tags:
      - '*.*.*'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release on Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Apache Maven Central
        uses: actions/setup-java@v4
        with: # running setup-java again overwrites the settings.xml
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }} # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for GPG private key passphrase

      - name: Build with Maven
        run: mvn -B -ntp verify

      - name: Create missing GitHub releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for release_tag in 3.0.7 3.0.8 "$GITHUB_REF_NAME"; do
            if gh release view "$release_tag" >/dev/null 2>&1; then
              echo "Release $release_tag already exists."
              continue
            fi
            if [[ "$release_tag" == "$GITHUB_REF_NAME" ]]; then
              gh release create "$release_tag" --verify-tag --generate-notes --title "$release_tag" --latest
            else
              gh release create "$release_tag" --verify-tag --generate-notes --title "$release_tag" --latest=false
            fi
          done

      - name: Validate Central credentials
        shell: bash
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [[ -z "$NEXUS_USERNAME" || -z "$NEXUS_PASSWORD" ]]; then
            echo "Missing credentials: set NEXUS_USERNAME and NEXUS_PASSWORD secrets."
            exit 1
          fi
         
      - name: Publish to Apache Maven Central
        run: mvn -B -ntp -Prelease deploy
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
