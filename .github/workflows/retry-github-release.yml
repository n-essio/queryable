name: Retry GitHub release

on:
  push:
    tags:
      - 'github-release-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_TAG: ${{ github.ref_name }}
        run: |
          TAG="${RETRY_TAG#github-release-}"
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG - Queryable Maven Plugin"